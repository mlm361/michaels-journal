{# Head styles for partials/webmentions.html (a <style> inside <body> is invalid HTML). #}
{% if config.extra.webmention_provider == "self_hosted" %}
<style>
  .webmentions { margin-top: 2.5rem; }
  .webmentions-heading {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(36, 94, 62, 0.85);
    margin: 0 0 0.7rem;
  }
  .webmentions-intro { font-size: 0.9rem; color: rgba(0, 0, 0, 0.58); margin: 0 0 1.3rem; }
  .wm-facepile { margin: 0 0 1.6rem; }
  .wm-facepile-label {
    font-size: 0.95rem;
    color: rgba(0, 0, 0, 0.7);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 0.55rem;
  }
  .wm-facepile-icon { color: #c0584f; }
  .wm-faces { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .wm-face-wrap { position: relative; display: inline-flex; }
  .wm-face {
    width: 2.15rem;
    height: 2.15rem;
    border-radius: 50%;
    overflow: hidden;
    background: #1d2733;
    border: 1px solid rgba(0, 0, 0, 0.08);
    display: inline-block;
    flex-shrink: 0;
  }
  .wm-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wm-platform-mark {
    position: absolute;
    right: -0.18rem;
    bottom: -0.18rem;
    width: 1rem;
    height: 1rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    background: #385a87;
    color: #fff;
    font-size: 0.58rem;
    font-weight: 800;
    line-height: 1;
  }
  .wm-face-initial {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 0.85rem;
    font-weight: 700;
    color: #f2f2f2;
  }
  .wm-replies-heading { font-size: 0.95rem; font-weight: 700; color: rgba(0, 0, 0, 0.55); margin: 0 0 0.85rem; }
  .wm-card {
    border: 1px solid rgba(128, 128, 128, 0.2);
    border-radius: 12px;
    padding: 1rem 1.15rem;
    margin: 0 0 0.95rem;
  }
  .wm-card-head { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.6rem; }
  .wm-card-avatar {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    overflow: hidden;
    background: #1d2733;
    flex-shrink: 0;
  }
  .wm-card-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wm-card-avatar .wm-face-initial { font-size: 1rem; }
  .wm-card-meta { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .wm-card-name { font-weight: 700; color: rgba(0, 0, 0, 0.85); text-decoration: none; }
  .wm-card-name:hover { text-decoration: underline; }
  .wm-card-submeta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.42rem; }
  .wm-card-date { font-size: 0.84rem; color: rgba(0, 0, 0, 0.45); }
  .wm-platform-badge {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(56, 90, 135, 0.22);
    border-radius: 999px;
    padding: 0.05rem 0.42rem;
    color: rgba(36, 75, 117, 0.82);
    background: rgba(56, 90, 135, 0.07);
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 1.35;
  }
  .wm-card-content { font-size: 0.96rem; line-height: 1.55; color: rgba(0, 0, 0, 0.82); margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  .wm-thread-children {
    border-left: 2px solid rgba(36, 94, 62, 0.2);
    margin: -0.25rem 0 0.95rem 1.1rem;
    padding-left: 1rem;
  }
  .wm-thread-children .wm-card { background: rgba(36, 94, 62, 0.025); }
  html.theme-dark .webmentions-heading { color: rgba(247, 207, 96, 0.9); }
  html.theme-dark .webmentions-intro,
  html.theme-dark .wm-facepile-label,
  html.theme-dark .wm-replies-heading { color: rgba(255, 255, 255, 0.62); }
  html.theme-dark .wm-card { border-color: rgba(255, 255, 255, 0.13); }
  html.theme-dark .wm-card-name { color: rgba(255, 255, 255, 0.9); }
  html.theme-dark .wm-card-content { color: rgba(255, 255, 255, 0.8); }
  html.theme-dark .wm-card-date { color: rgba(255, 255, 255, 0.42); }
  html.theme-dark .wm-platform-mark { border-color: #1d2733; }
  html.theme-dark .wm-platform-badge {
    border-color: rgba(151, 190, 235, 0.28);
    color: rgba(196, 220, 248, 0.88);
    background: rgba(104, 155, 211, 0.12);
  }
  html.theme-dark .wm-thread-children { border-left-color: rgba(247, 207, 96, 0.22); }
  html.theme-dark .wm-thread-children .wm-card { background: rgba(255, 255, 255, 0.025); }
</style>
{% endif %}
