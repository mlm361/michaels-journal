# JOURNAL-CSP-01: retention for the CSP report aggregates. No secrets and no outbound calls:
# success is stamped in PROD_DB retention_status (csp/d1-prod-retention-status.sql), read by a pi5 poller.
name = "csp-retention"
main = "index.js"
compatibility_date = "2025-07-05"
workers_dev = false

[triggers]
crons = ["17 3 * * *"]  # daily, 03:17 UTC

[[d1_databases]]
binding = "PREVIEW_DB"
database_name = "csp-reports-preview"
database_id = "58866c8d-c3d5-4d42-9112-a7724397a274"

[[d1_databases]]
binding = "PROD_DB"
database_name = "csp-reports-prod"
database_id = "d8eb48c2-693a-4c08-ae47-de1473ccefaf"
