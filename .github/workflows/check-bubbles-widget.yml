name: Check Bubbles widget pin

on:
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the reviewed upstream script still matches the SRI pin
        run: python3 scripts/verify_bubbles_widget.py --check-remote-hash
